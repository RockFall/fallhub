name: colony_design_system
description: Design tokens and UI components for Life Colony OS.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ui/chrome/
    - assets/ui/terminal/icons/
    - assets/ui/terminal/chrome/
    - assets/ui/terminal/portraits/
    - assets/ui/terminal/textures/
  fonts:
    - family: Pixelify Sans
      fonts:
        - asset: assets/fonts/PixelifySans-Regular.ttf
        - asset: assets/fonts/PixelifySans-Bold.ttf
          weight: 700
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-Regular.ttf
        - asset: assets/fonts/Arimo-Bold.ttf
          weight: 700
    - family: Carlito
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700
